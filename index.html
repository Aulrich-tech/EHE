const R=`<h3>Module 1 – Information Security</h3><ul><li>CIA + Authenticity; Non-repudiation = sender can’t deny sending</li><li>Security vs Functionality vs Usability – balance</li><li>Attacks: Passive, Active, Close-in, Insider, Distributed</li><li>Laws: PCI DSS, ISO/IEC 27001, HIPAA, SOX (11 titles), DMCA, FISMA, GDPR, DPA 2018; Pod-slurping</li></ul>

<h3>Module 3 – Threats</h3><ul><li>Sources: natural, unintentional, intentional (internal/external)</li><li>Malware components: Crypter, Downloader, Dropper, Exploit, Injector, Obfuscator, Packer, Payload</li><li>Types: Trojan, virus, ransomware, worm, rootkit, PUA/adware, spyware, keylogger, botnet, fileless</li><li>Vulnerability: remediation (highest risk first), verification (re-scan); CVE, NVD; scanning types</li></ul>
<h3>Module 4 – Passwords</h3><ul><li>SAM, NTLM, Kerberos; attack types: non-electronic, active/passive online, offline</li><li>Dictionary, brute-force, rule-based, guessing, pass-the-hash, pass-the-ticket, replay, rainbow table</li><li>Tools: L0phtCrack, Ophcrack, RainbowCrack</li></ul>
<h3>Module 5 – Social Engineering</h3><ul><li>Phases: research, select target, develop relationship, exploit</li><li>Human: impersonation, eavesdropping, shoulder surfing, dumpster diving, reverse SE, piggybacking, tailgating</li><li>Computer: pop-ups, hoax/chain letters, spam, scareware, phishing; Mobile: malicious apps</li><li>Insiders: malicious, negligent, professional, compromised; PhishTank, Netcraft</li></ul>
<h3>Module 6 – Network-Level Attacks</h3><ul><li>Sniffing (passive vs active), vulnerable protocols (Telnet, HTTP, FTP, POP/IMAP, SMTP)</li><li>MAC flooding, DHCP starvation, ARP spoofing, MAC spoofing, DNS poisoning</li><li>DDoS: UDP/ICMP flood, Ping of Death, Smurf, SYN flood, Phlashing; tools Hping3, HOIC, LOIC</li><li>Session hijacking (active/passive); spoofing vs hijacking; OWASP ZAP</li></ul>`;

$("fs").textContent=s+" / "+Q.length+" ("+p+"%)";$("fm").textContent=p>=90?"Excellent! You’re exam-ready.":p>=75?"Good job! Review the missed items below.":"Keep studying—open the reviewer and try again.";
$("rm").classList.toggle("hid",!miss.length);
$("ms").innerHTML=miss.length?"<b>Items to review:</b>"+miss.map(m=>'<div class="mi"><b>'+m[0]+"</b>Answer: "+m[1]+" — "+m[5]+"</div>").join(""):"<b>Perfect score—nothing to review!</b>"}
$("go").onclick=()=>begin(B);$("re").onclick=()=>begin(B);$("rm").onclick=()=>begin(miss.slice());
</script></body></html>
